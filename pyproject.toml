[project]
name = "flexexecutor"
description = "Executors for both async and sync functions and automatically scales the number of workers"
authors = [
  { name = "leavers" },
  { name = "Leavers", email = "leavers930@gmail.com" },
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/leavers/flexexecutor"
documentation = "https://github.com/leavers/flexexecutor/blob/main/README.md"
# changelog = "URL of changelog"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["flexexecutor.py"]
excludes = ["tests"]

[tool.pdm.version]
source = "file"
path = "flexexecutor.py"

[tool.coverage.run]
branch = true
source = ["flexexecutor.py"]
parallel = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

# use `pdm update --update-reuse` to update version specs
[dependency-groups]
dev = [
  "coverage[toml]>=7.6.1",
  "nox>=2024.4.15",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pytest-timeout>=2.3.1",
  "ruff>=0.9.10",
  "ty>=0.0.1a34",
  "python-lsp-server>=1.14.0",
]
